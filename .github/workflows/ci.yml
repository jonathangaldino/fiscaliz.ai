name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Convex generated code is up to date
        run: |
          npm run codegen
          git diff --exit-code convex/_generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
